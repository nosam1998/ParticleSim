name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install from the lockfile
        # --locked fails rather than silently re-resolving, so CI tests the
        # same dependency versions a contributor gets locally.
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q -m "not slow"
      - name: Benchmarks
        run: uv run pytest -q -m "benchmark and not slow"
      - name: GR limits
        run: uv run particlesim check-limits

  slow:
    runs-on: ubuntu-latest
    # Slow benchmarks would double every PR's feedback time, so they run on
    # main and on demand instead of gating each push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      # The 3D kernels are derived by SymPy on first use and cached on disk;
      # a CCZ4 right-hand side takes over ten minutes on a runner. Without
      # the cache every run re-derives each of them, and with pytest's
      # 600 s default the first test to need one times out mid-derivation,
      # so nothing is cached and the next test starts over. Restore and
      # save are separate so the cache is kept even when a test fails.
      - name: Restore derived kernels
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/particlesim
          key: kernels-${{ hashFiles('particlesim/symbolic/**', 'particlesim/solvers/nr/**') }}
          restore-keys: kernels-
      # A test that derives a kernel pays for it inside its own timeout.
      - run: uv run pytest -q -m slow -o timeout=2400
      - name: Save derived kernels
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/particlesim
          key: kernels-${{ hashFiles('particlesim/symbolic/**', 'particlesim/solvers/nr/**') }}
