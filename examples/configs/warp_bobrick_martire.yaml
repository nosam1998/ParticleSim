# Bobrick and Martire 2021 (CQG 38, 105009): the spherical, subluminal,
# constant-velocity member of their general class. The interior rate of time
# (A) and the shift (v_s) are independent; A = 2 makes time inside run at half
# rate. The lapse is not unity, so this goes through the full symbolic
# Einstein-tensor path, which is slow -- keep the resolution small.
scenario: warp.analyze
theory:
  gravity: gr
metric:
  family: bobrick_martire
  params: {v_s: 0.5, R: 5.0, sigma: 2.0, A: 2.0}
grid:
  extent: [[-12, 12], [-12, 12], [-12, 12]]
  resolution: [8, 8, 8]
analysis:
  energy_conditions: [NEC, WEC, SEC, DEC]
  full_stress_energy: true
output:
  dir: runs/warp_bobrick_martire
  formats: [npz, json]
seed: 0
