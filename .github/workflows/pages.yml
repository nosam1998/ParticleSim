name: Deploy demos to GitHub Pages

# Publishes the static browser demos under demos/ (design doc Section 5.7).
# Pages must use the "GitHub Actions" source; configure-pages enables it on
# the first run when the workflow token is allowed to.

on:
  push:
    branches: [main]
    paths:
      - "demos/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload demos
        uses: actions/upload-pages-artifact@v3
        with:
          path: demos
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
