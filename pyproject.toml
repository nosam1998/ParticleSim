[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "particlesim"
version = "0.1.0"
description = "Multi-theory spacetime, matter, and beam simulation framework"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "ParticleSim contributors" }]
dependencies = [
  "numpy>=1.26",
  "sympy>=1.12",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "h5py>=3.10",
  "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
notebook = ["ipywidgets>=8.1", "matplotlib>=3.8", "jupyterlab>=4.2"]
jax = ["jax[cpu]>=0.4.30"]
# Compiles CLASS from source and needs a C compiler, so it is an extra and
# not part of the dev group: the adapter's live tests skip without it.
boltzmann = ["classy>=3.2"]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "matplotlib>=3.8",
  "pre-commit>=3.7",
  "ipywidgets>=8.1",
  "jax[cpu]>=0.4.30",
]

[project.scripts]
particlesim = "particlesim.cli:main"

[project.entry-points."particlesim.theories"]
gr = "particlesim.theories.gr:GeneralRelativity"
"gr.lambda" = "particlesim.theories.gr_lambda:GRWithLambda"
"lqg.lqc" = "particlesim.theories.lqg.lqc:EffectiveLQC"
"lqg.polymer_bh" = "particlesim.theories.lqg.polymer_bh:PolymerBlackHole"
"asafety.rg_improved" = "particlesim.theories.asafety.rg_improved:RGImprovedSchwarzschild"
"string.kk" = "particlesim.theories.kk:KaluzaKlein"
"string.eft4d.dilaton" = "particlesim.theories.dilaton:Dilaton"
"string.compactify.torus" = "particlesim.theories.compactify:ToroidalCompactification"
"string.eft4d.emda" = "particlesim.theories.emda:EMDA"

[project.entry-points."particlesim.inflaton_potentials"]
"inflation.quadratic" = "particlesim.cosmo.potentials:Quadratic"
"inflation.power_law" = "particlesim.cosmo.potentials:PowerLaw"
"inflation.exponential" = "particlesim.cosmo.potentials:Exponential"
"inflation.starobinsky" = "particlesim.cosmo.potentials:Starobinsky"
"inflation.natural" = "particlesim.cosmo.potentials:Natural"
"string.cosmo.plateau" = "particlesim.cosmo.string_potentials:PlateauInflation"
"string.cosmo.kahler" = "particlesim.cosmo.string_potentials:KahlerModuli"
"string.cosmo.fibre" = "particlesim.cosmo.string_potentials:FibreInflation"
"string.cosmo.monodromy" = "particlesim.cosmo.string_potentials:AxionMonodromy"
"string.cosmo.dbrane" = "particlesim.cosmo.string_potentials:DBraneInflation"

[project.entry-points."particlesim.em_sectors"]
"gr.maxwell" = "particlesim.theories.em:Maxwell"
"string.eft4d.born_infeld" = "particlesim.theories.em:BornInfeld"
"qed.euler_heisenberg" = "particlesim.theories.em:EulerHeisenberg"
"string.eft4d.axion_photon" = "particlesim.theories.em:AxionPhoton"

[tool.hatch.build.targets.wheel]
packages = ["particlesim"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "NPY"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "benchmark: reproduces a published or closed-form result (Section 10 of the design doc)",
  "slow: takes more than a few seconds",
]
timeout = 600

[dependency-groups]
dev = [
    "astropy>=6.0",
]
